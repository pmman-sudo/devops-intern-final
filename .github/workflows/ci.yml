name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint Shell Scripts and Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build-test:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            --tag "devops-intern-final:${GITHUB_SHA}" \
            --file app/Dockerfile \
            app

      - name: Start application container
        run: |
          docker run -d \
            --name devops-intern-test \
            -p 8080:8080 \
            "devops-intern-final:${GITHUB_SHA}"

      - name: Wait for application readiness
        run: |
          ready=0

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/healthz; then
              echo
              echo "Application is ready."
              ready=1
              break
            fi

            echo "Waiting for application... attempt ${attempt}/20"
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker logs devops-intern-test
            exit 1
          fi

      - name: Run application health-check script
        run: ./scripts/healthcheck.sh http://localhost:8080/healthz

      - name: Verify build SHA response header
        run: |
          curl --fail --silent --show-error --head http://localhost:8080/ \
            | grep -iF "X-Build-SHA: ${GITHUB_SHA}"

      - name: Stop test container
        if: always()
        run: docker rm --force devops-intern-test || true
  publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
