server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nomad-nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nomad-nginx
          container: nginx
          nomad_alloc_id: 31342ca3-f988-85f9-013c-2dea87b94ddb
          __path__: /var/log/nomad/alloc/logs/nginx.stdout.0

    pipeline_stages:
      - regex:
          expression: '.*"(?P<method>[A-Z]+) (?P<path>[^ ]+) HTTP/[^"]+" (?P<status>[0-9]{3}) (?P<size>[0-9]+).*'
      - labels:
          method:
          status:
